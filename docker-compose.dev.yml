# Ambiente de desenvolvimento — sobrepõe o docker-compose.yml
# Iniciar: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Parar:   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
# Logs:    docker logs gestaosuas_app_dev -f

services:
  db:
    # Porta exposta ao host apenas em dev, para permitir rodar
    # `manage.py runserver` fora do Docker (ver CLAUDE.md).
    ports:
      - "5433:5432"

  app:
    container_name: gestaosuas_app_dev
    ports:
      - "8001:8000"
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=gestaosuas-django-dev-key-local
    depends_on:
      db:
        condition: service_healthy
